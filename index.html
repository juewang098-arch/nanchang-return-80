function card(p){const c=getColor(p);return `<article class="card ${picked.has(p.style)?'':'omit'}" data-style="${p.style}"><div class="photo"><button data-photo="${c.image||p.image||''}" data-title="${p.style} · ${c.color}" aria-label="放大${p.style}">${c.image||p.image?`<img src="${c.image||p.image}" loading="lazy" alt="${p.style} ${c.color}">`:'图片未匹配'}</button><span class="rank">${String(p.rank).padStart(2,'0')}</span><label class="pick"><input type="checkbox" data-pick="${p.style}" ${picked.has(p.style)?'checked':''}>${p.strict?'拟退':'确认备选'}</label><span class="group-label ${p.strict?'':'backup'}">${p.strictLabel}</span></div><div class="info"><div class="code">${p.style}</div><div class="meta">${p.category} · ${p.yearSeasons.join('/')} · 波段 ${p.waves.join('/')||'未提供'}</div><div class="numbers"><div><small>当前库存 · 全色</small><strong>${num(p.stock)}</strong><em>件</em></div><div><small>南昌累计售出</small><strong>${num(p.history.gross)}</strong><em>件</em></div></div><div class="recent ${p.history.recent60>0?'had-sale':''}">近60天售出 <b>${num(p.history.recent60)}件</b><span>近90天 ${num(p.history.recent90)}件</span></div><div class="regional"><span>南区10月售出 <b>${num(p.south.octGross)}件</b></span><span>南区累计 <b>${num(p.south.gross)}件</b></span></div><div class="colors">${p.colorList.map(x=>`<button class="color ${x.skc===c.skc?'on':''}" data-color="${x.skc}" data-style="${p.style}">${x.color} ${num(x.stock)}件</button>`).join('')}</div><div class="sku">${c.skc} · 标准价 ${money(c.price)}</div><div class="sizes">${Object.entries(c.sizes).map(([sz,q])=>`<div class="size ${q===0?'zero':''}"><span>${sz}</span><b>${num(q)}</b></div>`).join('')}</div><div class="launch">上市 ${dateLabel(p)} · 最晚色已上市 ${p.observedDays}天</div><div class="tags"><span class="tag">${p.season}款</span>${p.regionalZero?'<span class="tag">南区10月也未售</span>':''}${p.deep?'<span class="tag">库存≥8件</span>':''}${p.tail?'<span class="tag tail">仅剩1—3件</span>':''}</div><div class="context">同品类在店 ${p.categoryContext.styleCount}款 · ${p.categoryContext.colorCount}种颜色 · ${num(p.categoryContext.stock)}件</div><details><summary>查看入选依据与各店销量</summary><p>${p.strictLabel}：${p.supplementReason||'8月底前上市、近60天未售、累计≤3件'}。</p><p>${p.reasons.join('；')}。</p><p>南昌累计售出 ${num(p.history.gross)}件，退货 ${num(p.history.returnQty)}件，净销量 ${num(p.history.net)}件；近60天售出 ${num(p.history.recent60)}件，最后售出日期 ${p.history.lastSale||'源表内无记录'}。</p><p>南区10月单店最高 ${num(p.south.octMaxStore)}件。${Object.keys(p.south.octStores).length?Object.entries(p.south.octStores).sort((a,b)=>b[1]-a[1]).map(([n,q])=>n+' '+num(q)+'件').join('；'):'南区各店10月均无正向售出记录。'}</p></details></div></article>`}
function render(){const ps=current();$('#catalog').innerHTML=ps.map(card).join('')||'<div class="empty">没有符合当前筛选的商品。</div>';$('#result').textContent=`显示 ${ps.length} / 80款`;$('#table').innerHTML=`<table><thead><tr><th>组别</th><th>款号</th><th>季节</th><th>品类</th><th>波段</th><th>库存</th><th>累计售出</th><th>近60天售出</th><th>南区10月售出</th><th>上市日期</th><th>观察天数</th><th>备选原因</th><th>尺码库存</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${p.strictLabel}</td><td>${p.style}</td><td>${p.season}</td><td>${p.category}</td><td>${p.waves.join('/')||'未提供'}</td><td>${p.stock}</td><td>${p.history.gross}</td><td>${p.history.recent60}</td><td>${p.south.octGross}</td><td>${dateLabel(p)}</td><td>${p.observedDays}</td><td>${p.supplementReason}</td><td>${p.colorList.map(c=>c.color+' '+c.sizeText).join('；')}</td></tr>`).join('')}</tbody></table>`;$('#catalog').classList.toggle('hidden',isTable);$('#table').classList.toggle('hidden',!isTable);$('#view').textContent=isTable?'切换商品图':'切换明细表';$('#filters').innerHTML='';updatePicked()}
function updatePicked(){const ps=DATA.products.filter(p=>picked.has(p.style)),b=ps.filter(p=>!p.strict).length;$('#picked').innerHTML=`已勾选 <b>${ps.length}</b> 款${b?'（含备选'+b+'）':''}`;$('#pickedStock').innerHTML=`库存 <b>${num(ps.reduce((a,p)=>a+p.stock,0))}</b> 件`;try{localStorage.setItem('nanchang-return80-unified-v3',JSON.stringify([...picked]))}catch{}}
function exportPicked(){const rows=[['组别','款号','季节','品类','波段','库存件数','南昌累计售出','近60天售出','南区10月售出','上市日期','观察天数','备选原因或严格依据','款色尺码库存'],...DATA.products.filter(p=>picked.has(p.style)).map(p=>[p.strictLabel,p.style,p.season,p.category,p.waves.join('/'),p.stock,p.history.gross,p.history.recent60,p.south.octGross,dateLabel(p),p.observedDays,p.supplementReason,p.colorList.map(c=>c.skc+' '+c.color+' '+c.sizeText).join('；')])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='南昌拟退货_严格与备选勾选清单.csv';a.click();URL.revokeObjectURL(a.href)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.filter){mode=b.dataset.filter;render()}if(b.dataset.color){activeColor[b.dataset.style]=b.dataset.color;const p=DATA.products.find(x=>x.style===b.dataset.style);document.querySelector(`article[data-style="${p.style}"]`).outerHTML=card(p)}if(b.dataset.photo){$('#largePhoto').src=b.dataset.photo;$('#photoTitle').textContent=b.dataset.title;$('#photoDialog').showModal()}});
document.addEventListener('change',e=>{if(e.target.dataset.pick){const k=e.target.dataset.pick;if(e.target.checked)picked.add(k);else picked.delete(k);e.target.closest('.card').classList.toggle('omit',!e.target.checked);updatePicked()}});
$('#search').addEventListener('input',e=>{query=e.target.value.trim();render()});$('#category').onchange=e=>{category=e.target.value;render()};$('#sort').onchange=e=>{sort=e.target.value;render()};$('#view').onclick=()=>{isTable=!isTable;render()};$('#reset').onclick=()=>{picked=new Set(DATA.products.map(p=>p.style));mode='all';render()};$('#pickAll').onclick=()=>{picked=new Set(DATA.products.map(p=>p.style));render()};$('#export').onclick=exportPicked;$('#closePhoto').onclick=()=>$('#photoDialog').close();
$('#category').innerHTML+=[...new Set(DATA.products.map(p=>p.category))].map(c=>`<option value="${c}">${c}</option>`).join('');const S=DATA.summary;
$('#stats').innerHTML=[['拟退候选',80,'款，全部合并展示'],['当前库存',num(S.stock),'件，库存快照10月29日'],['款色数量',S.skcs,'个，图片可点击放大'],['季节分布',Object.entries(S.season).sort((a,b)=>'春夏秋冬'.indexOf(a[0])-'春夏秋冬'.indexOf(b[0])).map(([k,n])=>k+n).join(' / '),'在可选货品中兼顾四季']].map(([label,v,note])=>`<div class="stat"><small>${label}</small><b class="${label==='季节分布'?'season-stat':''}">${v}</b><span>${note}</span></div>`).join('');
$('#summary').innerHTML=`<strong>保护清单已生效：新发一口价44个款色、EY51851、上市日期缺失款均排除。</strong><span>全部80款合并展示，图片标签区分严格款与备选。</span>`;
$('#method').innerHTML=`<p><b>本次调整：</b>一口价文件44个款色全部按款号保护，同款其他颜色也不推荐退；EY51851整款保留；模板任何库存颜色缺少上市日期的整款按新发货保护；11A、10月上市及南区10月售出≥10件的款暂不纳入。34款满足原始“早上市、60天未售、累计≤3件”，其中7款南区仍有较高销量，保护后严格组为${S.strictCount}款。</p><p><b>严格组：</b>各库存颜色均有明确上市日期，最晚不晚于8月31日（截至10月29日约59天及以上）；8月31日—10月29日无正向售出，南昌源表累计售出≤3件。近90天窗口为8月1日—10月29日。严格与备选由图片标签区分，不把观察时间不足算作长期滞销。</p><p><b>补充备选：</b>在同样保护名单下，仍要求南昌10月1—29日未售、累计售出≤5件；部分9月上市观察期不足60天，部分近60天曾售出少量，或累计4—5件。放宽原因显示在每张卡片上。总计80款、${S.skcs}个款色、${num(S.stock)}件，全部合并展示，图片标签区分严格款与备选；可以取消不需要的款再导出。</p><p><b>销量与日期：</b>累计售出取正数量件数，退货另列，不用退货抵成未售。南昌源表覆盖${S.ncSourceMin}—${S.ncSourceMax}，截止口径为10月29日；南区累计${S.sourceMin}—${S.sourceMax}。当前库存为10月29日快照。上市日期只取模板明确记录；波段优先线下波段，缺失时查资料商品波段，不按波段猜上市日期。</p><p><b>四季与库存：</b>春夏秋冬都从可选货品中安排，不为均分季节破坏保护规则。深库存≥8件、零散库存1—3件；同品类款数和颜色数来自完整门店服装库存。</p>`;
$('#categoryBars').innerHTML=Object.entries(S.category).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<span>${c} ${n}款</span>`).join('');render();
</script></body></html>
